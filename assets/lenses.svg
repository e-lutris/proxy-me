<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="An example lenses.md: one lens with its rule, what to look for and quotes, plus how you decide, standing rules, tells and open threads">
  <style>
    :root { --bg:#ffffff; --card:#ffffff; --soft:#f5f8fb; --line:#e2e8f0; --ink:#334155; --muted:#64748b; --blue:#3073f0; --blue-soft:#e8f0fe; --bad:#b91c1c; --bad-soft:#fdecec; --warn:#b45309; --warn-soft:#fdf3e2; --good:#047857; --good-soft:#e6f6ef; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#07111f; --soft:#0b1625; --line:#18263a; --ink:#f8fafc; --muted:#9aa9bd; --blue:#6b9cff; --blue-soft:#10233f; --bad:#fca5a5; --bad-soft:#2a1416; --warn:#fcd34d; --warn-soft:#2a2212; --good:#6ee7b7; --good-soft:#0f2a22; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .soft { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
    .h { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12px; fill: var(--muted); }
    .t { font-size: 13px; }
    .tm { font-size: 12px; fill: var(--muted); }
    .bubble { fill: var(--blue-soft); }
    .count { font-size: 12px; font-weight: 700; fill: var(--blue); }
    .num { font-size: 12px; font-weight: 700; fill: var(--blue); }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .ahead { fill: var(--muted); }
    .lbl { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .04em; }
    .bad { fill: var(--bad-soft); } .badt { fill: var(--bad); font-size: 11px; font-weight: 700; }
    .warn { fill: var(--warn-soft); } .warnt { fill: var(--warn); font-size: 11px; font-weight: 700; }
    .good { fill: var(--good-soft); } .goodt { fill: var(--good); font-size: 11px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--muted); }
      .pill { font-size: 11px; font-weight: 700; }
    .dash { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .strike { stroke: var(--muted); stroke-width: 1.2; }
    .faint { opacity: .45; }
    .big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .gray { fill: var(--soft); }
  </style>
  <rect class="bg" width="1200" height="520" rx="16"/>
  <rect class="card" x="32" y="32" width="1136" height="456" rx="16"/>
  <text class="h" x="56" y="66">lenses.md</text>
  <text class="sub" x="56" y="86">Learned from your messages. Every line points back to something you said.</text>
  <line x1="56" y1="104" x2="1144" y2="104" stroke="var(--line)"/>
  <text class="lbl" x="56" y="134">LENS 02</text>
  <text x="56" y="162" style="font-size:18px;font-weight:700">Nothing jumps while loading</text>
  <text class="tm" x="56" y="196">RULE</text>
  <text class="t" x="56" y="216">No layout shift, flicker or late text on first paint or on back-navigation.</text>
  <text class="tm" x="56" y="250">LOOK FOR</text>
  <text class="t" x="56" y="270">· async content without a placeholder</text>
  <text class="t" x="56" y="290">· images without a fixed size</text>
  <text class="t" x="56" y="310">· text that swaps after hydration</text>
  <text class="tm" x="56" y="344">YOUR WORDS</text>
  <rect class="bubble" x="56" y="356" width="500" height="40" rx="12"/><text class="t" x="72" y="381">“The header jumps every time I come back.”</text><text class="tm" x="540" y="381" text-anchor="end">03-20</text>
  <rect class="bubble" x="56" y="404" width="500" height="40" rx="12"/><text class="t" x="72" y="429">“It flashes the default avatar first.”</text><text class="tm" x="540" y="429" text-anchor="end">05-01</text>
  <line x1="600" y1="124" x2="600" y2="460" stroke="var(--line)"/>
  <text class="lbl" x="632" y="134">HOW YOU DECIDE</text>
  <text class="t" x="632" y="158">· Wants to see the screen before choosing</text>
  <text class="t" x="632" y="180">· Wants one recommendation, not a menu</text>
  <text class="lbl" x="632" y="222">STANDING RULES</text>
  <text class="t" x="632" y="246">· “Always run the full check before done.”</text>
  <text class="lbl" x="632" y="288">TELLS</text>
  <text class="t" x="632" y="312">· “…again?” · “this looks cheap” · “why is…”</text>
  <text class="lbl" x="632" y="354">OPEN THREADS</text>
  <text class="t" x="632" y="378">☐ Sign in with Apple — “after the first release”</text>
  <text class="t" x="632" y="400">☐ Clean up old test accounts</text>
  <text class="tm" x="632" y="460">8–15 lenses in total, most repeated first.</text>
</svg>
