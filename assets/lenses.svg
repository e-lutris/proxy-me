<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 840" width="480" height="840" role="img" aria-label="An example lenses.md: one lens with its rule, what to look for and quotes, plus how you decide, standing rules, tells and open threads">
  <style>
    :root { --bg:#ffffff; --card:#ffffff; --soft:#f5f8fb; --line:#e2e8f0; --ink:#334155; --muted:#64748b; --blue:#3073f0; --blue-soft:#e8f0fe; --bad:#b91c1c; --bad-soft:#fdecec; --warn:#b45309; --warn-soft:#fdf3e2; --good:#047857; --good-soft:#e6f6ef; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#07111f; --soft:#0b1625; --line:#18263a; --ink:#f8fafc; --muted:#9aa9bd; --blue:#6b9cff; --blue-soft:#10233f; --bad:#fca5a5; --bad-soft:#2a1416; --warn:#fcd34d; --warn-soft:#2a2212; --good:#6ee7b7; --good-soft:#0f2a22; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); } .card { fill: var(--card); stroke: var(--line); stroke-width: 1; } .soft { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
    .h { font-size: 17px; font-weight: 700; } .sub { font-size: 13px; fill: var(--muted); }
    .t { font-size: 14px; } .b { font-weight: 700; } .tm { font-size: 13px; fill: var(--muted); }
    .bubble { fill: var(--blue-soft); } .count { font-size: 13px; font-weight: 700; fill: var(--blue); }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; } .ahead { fill: var(--muted); }
    .lbl { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .05em; }
    .bad { fill: var(--bad-soft); } .badt { fill: var(--bad); } .warn { fill: var(--warn-soft); } .warnt { fill: var(--warn); }
    .good { fill: var(--good-soft); } .goodt { fill: var(--good); } .gray { fill: var(--soft); } .grayt { fill: var(--muted); }
    .pill { font-size: 11px; font-weight: 700; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: var(--muted); }
    .dash { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; } .faint { opacity: .45; }
    .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
  <rect class="bg" width="480" height="840" rx="16"/>
  <rect class="card" x="20" y="20" width="440" height="800" rx="16"/>
  <text class="h" x="40" y="52">lenses.md</text>
  <text class="sub" x="40" y="72">Every line points back to something you said</text>
  <text class="lbl" x="40" y="110">LENS 02</text>
  <text class="b" style="font-size:19px" x="40" y="138">Nothing jumps while loading</text>
  <text class="lbl" x="40" y="174">RULE</text>
  <text class="t" x="40" y="196">No layout shift, flicker or late text,</text>
  <text class="t" x="40" y="216">on first paint or on back-navigation.</text>
  <text class="lbl" x="40" y="250">LOOK FOR</text>
  <text class="t" x="40" y="272">· async content without a placeholder</text>
  <text class="t" x="40" y="292">· images without a fixed size</text>
  <text class="t" x="40" y="312">· text that swaps after hydration</text>
  <text class="lbl" x="40" y="346">YOUR WORDS</text>
  <rect class="bubble" x="40" y="360" width="400" height="42" rx="12"/><text class="t" x="54" y="386">“The header jumps every time I come back.”</text><text class="tm" x="428" y="386" text-anchor="end">03-20</text>
  <rect class="bubble" x="40" y="412" width="400" height="42" rx="12"/><text class="t" x="54" y="438">“It flashes the default avatar first.”</text><text class="tm" x="428" y="438" text-anchor="end">05-01</text>
  <line x1="40" y1="484" x2="440" y2="484" stroke="var(--line)"/>
  <text class="lbl" x="40" y="518">HOW YOU DECIDE</text>
  <text class="t" x="40" y="542">· Wants to see the screen before choosing</text>
  <text class="t" x="40" y="564">· Wants one recommendation, not a menu</text>
  <text class="lbl" x="40" y="598">STANDING RULES</text>
  <text class="t" x="40" y="622">· “Always run the full check before done.”</text>
  <text class="lbl" x="40" y="656">TELLS</text>
  <text class="t" x="40" y="680">· “…again?” · “this looks cheap” · “why is…”</text>
  <text class="lbl" x="40" y="714">OPEN THREADS</text>
  <text class="t" x="40" y="738">☐ Sign in with Apple — “after release”</text>
  <text class="t" x="40" y="760">☐ Clean up old test accounts</text>
  <text class="tm" x="40" y="800">8–15 lenses in total, most repeated first.</text>
</svg>
