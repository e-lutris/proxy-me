<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1268" width="480" height="1268" role="img" aria-label="Review pipeline: inventory the project, fan out to subagents by area, verify each finding and drop what cannot be confirmed, then rank">
  <style>
    :root { --bg:#ffffff; --card:#ffffff; --soft:#f5f8fb; --line:#e2e8f0; --ink:#334155; --muted:#64748b; --blue:#3073f0; --blue-soft:#e8f0fe; --bad:#b91c1c; --bad-soft:#fdecec; --warn:#b45309; --warn-soft:#fdf3e2; --good:#047857; --good-soft:#e6f6ef; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#07111f; --soft:#0b1625; --line:#18263a; --ink:#f8fafc; --muted:#9aa9bd; --blue:#6b9cff; --blue-soft:#10233f; --bad:#fca5a5; --bad-soft:#2a1416; --warn:#fcd34d; --warn-soft:#2a2212; --good:#6ee7b7; --good-soft:#0f2a22; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); } .card { fill: var(--card); stroke: var(--line); stroke-width: 1; } .soft { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
    .h { font-size: 17px; font-weight: 700; } .sub { font-size: 13px; fill: var(--muted); }
    .t { font-size: 14px; } .b { font-weight: 700; } .tm { font-size: 13px; fill: var(--muted); }
    .bubble { fill: var(--blue-soft); } .count { font-size: 13px; font-weight: 700; fill: var(--blue); }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; } .ahead { fill: var(--muted); }
    .lbl { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .05em; }
    .bad { fill: var(--bad-soft); } .badt { fill: var(--bad); } .warn { fill: var(--warn-soft); } .warnt { fill: var(--warn); }
    .good { fill: var(--good-soft); } .goodt { fill: var(--good); } .gray { fill: var(--soft); } .grayt { fill: var(--muted); }
    .pill { font-size: 11px; font-weight: 700; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: var(--muted); }
    .dash { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; } .faint { opacity: .45; }
    .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
  <rect class="bg" width="480" height="1268" rx="16"/>
  <rect class="card" x="20" y="20" width="440" height="210" rx="16"/>
  <text class="h" x="40" y="52">1  Inventory</text>
  <text class="sub" x="40" y="72">What there is to check</text>
  <rect class="soft" x="40" y="92" width="195" height="36" rx="10"/><text class="t" x="52" y="115">Project rules</text>
  <rect class="soft" x="245" y="92" width="195" height="36" rx="10"/><text class="t" x="257" y="115">Screens and routes</text>
  <rect class="soft" x="40" y="138" width="195" height="36" rx="10"/><text class="t" x="52" y="161">Recent commits</text>
  <rect class="soft" x="245" y="138" width="195" height="36" rx="10"/><text class="t" x="257" y="161">TODOs, open threads</text>
  <rect class="soft" x="40" y="184" width="195" height="36" rx="10"/><text class="t" x="52" y="207">Screenshots</text>
  <path class="arrow" d="M240.0 240 V272"/><path class="ahead" d="M234.0 270 L240.0 280 L246.0 270 Z"/>
  <rect class="card" x="20" y="290" width="440" height="164" rx="16"/>
  <text class="h" x="40" y="322">2  Fan out</text>
  <text class="sub" x="40" y="342">One subagent per area, each reads every lens</text>
  <rect class="soft" x="40" y="362" width="195" height="36" rx="10"/><text class="t b" x="52" y="385">Onboarding &amp; sign-in</text>
  <rect class="soft" x="245" y="362" width="195" height="36" rx="10"/><text class="t b" x="257" y="385">Core flow</text>
  <rect class="soft" x="40" y="408" width="195" height="36" rx="10"/><text class="t b" x="52" y="431">Settings &amp; billing</text>
  <rect class="soft" x="245" y="408" width="195" height="36" rx="10"/><text class="t b" x="257" y="431">Consistency sweep</text>
  <path class="arrow" d="M240.0 464 V496"/><path class="ahead" d="M234.0 494 L240.0 504 L246.0 494 Z"/>
  <rect class="card" x="20" y="514" width="440" height="366" rx="16"/>
  <text class="h" x="40" y="546">3  Verify</text>
  <text class="sub" x="40" y="566">Open the file, look at the screen</text>
  <text class="lbl" x="40" y="598">CANDIDATES</text><text class="big" x="40" y="630">23</text><text class="lbl" x="180" y="598">CONFIRMED</text><text class="big goodt" x="180" y="630">11</text>
  <rect class="good" x="40" y="654" width="50" height="20" rx="6"/><text class="goodt pill" x="65" y="668" text-anchor="middle">KEEP</text><text class="t" x="102" y="669">Header shifts after sign-in</text>
  <rect class="good" x="40" y="690" width="50" height="20" rx="6"/><text class="goodt pill" x="65" y="704" text-anchor="middle">KEEP</text><text class="t" x="102" y="705">Old close button on 2 sheets</text>
  <g class="faint"><rect class="gray" x="40" y="726" width="50" height="20" rx="6"/><text class="grayt pill" x="65" y="740" text-anchor="middle">DROP</text><text class="t" x="102" y="741">Already fixed on this branch</text></g>
  <g class="faint"><rect class="gray" x="40" y="762" width="50" height="20" rx="6"/><text class="grayt pill" x="65" y="776" text-anchor="middle">DROP</text><text class="t" x="102" y="777">Intentional, per the rules</text></g>
  <rect class="good" x="40" y="798" width="50" height="20" rx="6"/><text class="goodt pill" x="65" y="812" text-anchor="middle">KEEP</text><text class="t" x="102" y="813">“7 days free” after trial</text>
  <g class="faint"><rect class="gray" x="40" y="834" width="50" height="20" rx="6"/><text class="grayt pill" x="65" y="848" text-anchor="middle">DROP</text><text class="t" x="102" y="849">Not reproducible</text></g>
  <path class="arrow" d="M240.0 890 V922"/><path class="ahead" d="M234.0 920 L240.0 930 L246.0 920 Z"/>
  <rect class="card" x="20" y="940" width="440" height="308" rx="16"/>
  <text class="h" x="40" y="972">4  Rank</text>
  <text class="sub" x="40" y="992">Heaviest first</text>
  <rect class="bad" x="40" y="1012" width="50" height="20" rx="6"/><text class="badt pill" x="65" y="1026" text-anchor="middle">HIGH</text><text class="t" x="102" y="1027">Breaks a written rule</text>
  <rect class="bad" x="40" y="1048" width="50" height="20" rx="6"/><text class="badt pill" x="65" y="1062" text-anchor="middle">HIGH</text><text class="t" x="102" y="1063">A lens you repeat often</text>
  <rect class="warn" x="40" y="1084" width="50" height="20" rx="6"/><text class="warnt pill" x="65" y="1098" text-anchor="middle">MED</text><text class="t" x="102" y="1099">On the main path</text>
  <rect class="warn" x="40" y="1120" width="50" height="20" rx="6"/><text class="warnt pill" x="65" y="1134" text-anchor="middle">MED</text><text class="t" x="102" y="1135">Release risk</text>
  <rect class="gray" x="40" y="1156" width="50" height="20" rx="6"/><text class="grayt pill" x="65" y="1170" text-anchor="middle">TIE</text><text class="t" x="102" y="1171">Cheap fix breaks ties</text>
  <text class="tm" x="40" y="1214">→ review-YYYY-MM-DD.md, plus a short summary in chat</text>
</svg>
